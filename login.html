<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오케퐁 로그인</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f9fb;font-family:Arial,"Noto Sans KR",sans-serif;color:#20252b}.card{width:min(420px,calc(100% - 40px));padding:38px;background:#fff;border-radius:24px;box-shadow:0 14px 40px #20252b12}.logo{color:#f4512a;font-size:24px;font-weight:800}.eyebrow{display:block;margin-top:48px;color:#f4512a;font-size:10px;font-weight:800;letter-spacing:.15em}.card h1{margin:8px 0;color:#20252b}.card p{color:#7a828a;font-size:14px}.field{display:grid;gap:8px;margin-top:20px;color:#606a72;font-size:12px;font-weight:700}.field input{padding:14px;border:1px solid #e7eaed;border-radius:12px;font:inherit}.submit{width:100%;margin-top:24px;border:0;border-radius:12px;padding:14px;background:#f4512a;color:#fff;font-weight:700;cursor:pointer}</style></head><body><main class="card"><div class="logo">● 오케퐁</div><span class="eyebrow">IT HELP DESK</span><h1>로그인</h1><p>계정으로 오케퐁에 접속해 주세요.</p><label class="field">로그인 ID<input placeholder="로그인 ID 입력"></label><label class="field">비밀번호<input type="password" placeholder="비밀번호 입력"></label><button class="submit" onclick="location.href='preview.html'">로그인</button></main></body></html>
