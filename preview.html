<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오케퐁 IT Help Desk 미리보기</title>
  <style>
    :root{font-family:Arial,"Noto Sans KR",sans-serif;color:#20252b;background:#f8f9fb}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:flex}.side{width:168px;margin:32px 0 32px 34px;border-radius:22px;background:#fff;box-shadow:0 12px 32px #20252b0b;padding:14px 12px;display:flex;flex-direction:column}.logo{height:80px;border-bottom:1px solid #f0f1f3;display:grid;place-items:center;color:#f4512a;font-size:20px;font-weight:800}.nav{padding:22px 0;display:grid;gap:8px}.nav button{height:62px;border:0;border-radius:16px;background:#fff;color:#5f6871;font-weight:700;cursor:pointer}.nav button.active{background:#fff1ed;color:#f4512a}.logout{margin-top:auto;border:0;border-top:1px solid #f0f1f3;background:#fff;padding:20px 0 8px;color:#68717a}.main{flex:1;min-width:0}.top{height:82px;display:flex;justify-content:flex-end;align-items:center;padding:0 48px;color:#68717a;font-size:13px}.content{max-width:1180px;margin:auto;padding:22px 48px 64px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.title h1{font-size:34px;margin:8px 0 0;letter-spacing:-.06em}.title p{color:#7a828a;margin:8px 0 0}.eyebrow{color:#f4512a;font-size:10px;font-weight:800;letter-spacing:.15em}.actions{display:flex;gap:12px}.actions button{border:1px solid #eef0f2;border-radius:26px;background:#fff;padding:14px 20px;font-weight:700}.actions button:last-child{background:#202124;color:#fff}.cards{display:grid;gap:12px}.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #20252b0a;overflow:hidden}.summary{width:100%;border:0;background:#fff;display:flex;align-items:center;gap:18px;padding:20px 26px;text-align:left;cursor:pointer}.bubble{width:44px;height:44px;border-radius:50%;background:#fff7f4;color:#f4512a;display:grid;place-items:center;font-size:24px}.copy{flex:1}.copy strong{display:block;font-size:17px}.copy small{display:block;color:#868e96;margin-top:7px}.status{border-radius:18px;padding:10px 16px;background:#fff0ea;color:#f4512a;font-weight:700;font-size:12px}.status.done{background:#f0f1f3;color:#505960}.detail{display:none;border-top:1px solid #f1f2f3;background:#fbfbfc;padding:22px 34px;color:#626b73;line-height:1.7}.card.open .detail{display:block}.detail b{display:block;color:#30363b;margin-bottom:5px}.meta{border-top:1px solid #eef0f2;margin-top:18px;padding-top:14px;font-size:12px;color:#747d85}@media(max-width:700px){.side{width:74px;margin:0;border-radius:0;padding:8px}.logo{font-size:12px}.nav button{font-size:0}.nav button:first-letter{font-size:22px}.content{padding:16px}.top{height:68px;padding:0 18px}.title{align-items:start;gap:18px;flex-direction:column}.actions{width:100%}.actions button{flex:1}.summary{padding:16px;flex-wrap:wrap}.copy{min-width:calc(100% - 65px)}.status{margin-left:62px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"><div class="logo">● 오케퐁</div><nav class="nav"><button class="active" data-screen="requests">◌ 내 문의</button><button data-screen="ask">✎ 질문하기</button><button data-screen="admin">▣ 티켓 관리</button><button data-screen="alerts">⚠ 긴급 알림</button></nav><button class="logout" onclick="location.href='login.html'">↪ 로그아웃</button></aside>
    <main class="main"><header class="top">김민지 님　|　IT팀　⌄　│　로그아웃</header><section class="content"><div class="title"><div><span class="eyebrow">OKE PONG IT HELP DESK</span><h1 id="heading">내 문의</h1><p id="description">오케퐁에 문의한 내용과 처리 현황을 확인할 수 있어요.</p></div><div class="actions"><button onclick="location.reload()">⟳ 새로고침</button><button data-screen="ask">✎ 질문하기</button></div></div><div id="cards" class="cards"></div></section></main>
  </div>
  <script>
    const data={requests:[['VPN 접속이 안돼요. 어떻게 해야 하나요?','문의일시 2025.11.04 (화) 14:32','처리 중','VPN 접속이 자꾸 끊겨요. 재부팅해도 동일한 현상이 발생합니다.','T-2001 · 접수'],['사내 메신저 오류가 나요','문의일시 2025.11.03 (월) 10:21','완료','메신저 오류가 발생해 업무를 진행할 수 없습니다.','티켓 없음'],['노트북 비밀번호를 변경하고 싶어요','문의일시 2025.10.29 (수) 16:17','접수','재택근무용 노트북의 비밀번호 변경 방법을 알려주세요.','티켓 없음']],admin:[['문의 티켓 관리','전체 3건','처리 중','담당자·처리 상태·답변을 관리하는 화면입니다.','API 연결 전 Mock 화면'],['답변 대기 티켓','T-1999','접수','아직 답변이 등록되지 않은 문의입니다.','관리자 권한 필요']],alerts:[['VPN 문의가 긴급 티켓으로 분류되었습니다.','create-ticket · T-2001','긴급','워크플로우에서 발생한 긴급 알림입니다.','방금 전'] ]};
    const titles={requests:['내 문의','오케퐁에 문의한 내용과 처리 현황을 확인할 수 있어요.'],admin:['티켓 관리','접수된 문의의 담당자, 처리 상태와 답변을 관리할 수 있어요.'],alerts:['긴급 알림','워크플로우와 티켓 처리 과정에서 발생한 알림을 확인하세요.'],ask:['질문하기','궁금한 내용을 입력하면 오케퐁이 답변을 찾아드려요.']};
    function render(screen){document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));const key=screen==='ask'?'ask':screen;document.querySelector('#heading').textContent=titles[key][0];document.querySelector('#description').textContent=titles[key][1];const cards=document.querySelector('#cards');if(screen==='ask'){cards.innerHTML='<article class="card" style="padding:28px"><span class="eyebrow">IT 문의</span><h2>무엇이 궁금하신가요?</h2><textarea style="width:100%;height:180px;border:1px solid #e7eaed;border-radius:14px;padding:16px" placeholder="질문 내용을 입력해 주세요."></textarea><button style="margin-top:16px;border:0;border-radius:12px;background:#f4512a;color:#fff;padding:14px 22px;font-weight:700">질문 보내기</button></article>';return}cards.innerHTML=(data[key]||data.requests).map((item,i)=>`<article class="card"><button class="summary" onclick="this.parentElement.classList.toggle('open')"><span class="bubble">${screen==='alerts'?'⚠':'◌'}</span><span class="copy"><strong>${item[0]}</strong><small>${item[1]}</small></span><span class="status ${item[2]==='완료'?'done':''}">${item[2]}</span><span>⌄</span></button><div class="detail"><b>내용</b>${item[3]}<div class="meta"><b>상태 및 참고</b>${item[4]}</div></div></article>`).join('')}
    document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.screen)));render('requests');
  </script>
</body>
</html>
